<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b2d5c">
<link rel="manifest" href="manifest.json">
<title>Baseball Growth</title>
<style>
:root{--navy:#0b2d5c;--blue:#1458a5;--bg:#f4f7fa;--card:#fff;--text:#17202a;--muted:#6b7280;--line:#dfe5ec;--green:#238a4b;--orange:#cf6a20}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:var(--text)}
button,input,select,textarea{font:inherit}.app{max-width:760px;margin:auto;min-height:100vh;background:#fff;padding-bottom:88px}
header{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,#08264f,#17477f);color:#fff;padding:14px 16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:21px;font-weight:900}.sub{font-size:12px;opacity:.85}
.playerSelect{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:8px 11px;max-width:45%}
main{padding:14px}.page{display:none}.page.active{display:block}.title{font-weight:900;font-size:21px;margin:6px 0 12px}
.card{border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.04)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}.k{font-size:11px;color:var(--muted)}.v{font-size:24px;font-weight:900;margin-top:4px}
.blue{color:var(--blue)}.green{color:var(--green)}.orange{color:var(--orange)}.btn{border:0;border-radius:12px;padding:13px 14px;font-weight:800}.primary{width:100%;background:var(--navy);color:#fff}.outline{background:#fff;border:1px solid var(--line)}.danger{background:#fff2f2;color:#a92727;border:1px solid #efc3c3}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{font-size:12px;font-weight:800;color:#46505b}input,select,textarea{width:100%;margin-top:5px;padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff}textarea{min-height:75px}
.result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}.choice{padding:11px 5px;border:1px solid var(--line);border-radius:10px;background:#fff;font-weight:800;font-size:13px}.choice.active{background:#e9f2ff;border-color:#83afe7;color:#0a4f97}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 10px;font-size:12px;font-weight:800}.chip.active{background:var(--navy);border-color:var(--navy);color:#fff}
.atbat{border-top:1px dashed var(--line);padding-top:12px;margin-top:12px}.atbat:first-child{border-top:0;margin-top:0;padding-top:0}.athead{display:flex;justify-content:space-between;align-items:center}.tiny{font-size:12px;color:var(--muted)}
.stepper{display:flex;align-items:center;gap:10px;margin-top:7px}.stepper button{width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:22px}.stepper span{min-width:24px;text-align:center;font-weight:900}
.posgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:8px}.posbtn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 4px;font-weight:800;font-size:12px}.posbtn.active{background:#edf4ff;border-color:#8cb4e8;color:#0b4e94}
.row{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:11px 0}.row:last-child{border-bottom:0}.row b{display:block}.meta{font-size:12px;color:var(--muted);margin-top:3px}
.analysis-row{display:grid;grid-template-columns:100px 1fr 52px;gap:8px;align-items:center;margin:9px 0;font-size:13px}.bar{height:10px;background:#edf1f5;border-radius:999px;overflow:hidden}.bar div{height:100%;background:var(--blue)}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:760px;width:100%;display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:#fff;padding-bottom:max(6px,env(safe-area-inset-bottom));z-index:30}.nav{border:0;background:#fff;padding:9px 3px 7px;font-size:11px;color:#6d7681}.nav b{display:block;font-size:18px}.nav.active{color:var(--navy);font-weight:900}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:50;align-items:flex-end}.modal.open{display:flex}.sheet{width:min(760px,100%);margin:auto;max-height:94vh;overflow:auto;background:#fff;border-radius:20px 20px 0 0;padding:15px 14px calc(18px + env(safe-area-inset-bottom))}.sheethead{display:flex;justify-content:space-between;align-items:center;position:sticky;top:-15px;background:#fff;padding:10px 0;z-index:5}.close{width:36px;height:36px;border:0;border-radius:999px;background:#eef2f6;font-size:22px}
.empty{text-align:center;color:var(--muted);padding:22px}.grow{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.growcard{border:1px solid var(--line);border-radius:12px;padding:11px}.section{font-weight:900;margin:4px 0 9px}
.playerCard{display:flex;justify-content:space-between;gap:10px;align-items:center}.playerName{font-size:18px;font-weight:900}
@media(max-width:480px){.grid2{grid-template-columns:1fr}.v{font-size:21px}}
</style>
</head>
<body>
<div class="app">
<header><div class="top"><div><div class="brand">⚾ Baseball Growth</div><div class="sub">兄弟それぞれの野球成長記録・Ver.2.2</div></div><select id="playerSelect" class="playerSelect"></select></div></header>
<main>
<section id="home" class="page active">
<div id="playerSummary" class="card"></div>
<div class="title">今シーズン</div>
<div class="stats">
<div class="stat"><div class="k">打率</div><div id="hAVG" class="v blue">.---</div></div>
<div class="stat"><div class="k">出塁率</div><div id="hOBP" class="v green">.---</div></div>
<div class="stat"><div class="k">OPS</div><div id="hOPS" class="v orange">.---</div></div>
<div class="stat"><div class="k">安打</div><div id="hH" class="v">0</div></div>
<div class="stat"><div class="k">打点</div><div id="hRBI" class="v">0</div></div>
<div class="stat"><div class="k">盗塁</div><div id="hSB" class="v">0</div></div>
</div>
<div class="card" style="margin-top:12px"><button id="newGame" class="btn primary">＋ 試合を記録する</button></div>
<div class="card"><div class="section">最近5試合</div><div id="recent"></div></div>
</section>

<section id="games" class="page"><div class="title">試合一覧</div><div class="card"><button id="newGame2" class="btn primary">＋ 新しい試合</button></div><div id="gameList" class="card"></div></section>
<section id="stats" class="page"><div class="title">成績</div><div class="card"><div id="statsGrid" class="stats"></div></div></section>
<section id="analysis" class="page"><div class="title">分析</div><div class="card"><div class="section">打順別成績</div><div id="orderAnalysis"></div></div><div class="card"><div class="section">打球方向</div><div id="dirAnalysis"></div></div><div class="card"><div class="section">打球タイプ</div><div id="contactAnalysis"></div></div><div class="card"><div class="section">選球・得点圏</div><div id="discAnalysis"></div></div></section>
<section id="growth" class="page"><div class="title">成長</div><div class="card"><div class="section">学年別</div><div id="gradeGrowth" class="grow"></div></div><div class="card"><div class="section">試合メモ</div><div id="memoList"></div></div><div class="card"><div class="section">選手管理</div><div id="playerList"></div><button id="addPlayerBtn" class="btn outline" style="width:100%;margin-top:8px">＋ 選手を追加</button></div></section>
</main>
<nav class="bottom"><button class="nav active" data-tab="home"><b>⌂</b>ホーム</button><button class="nav" data-tab="games"><b>＋</b>試合</button><button class="nav" data-tab="stats"><b>▥</b>成績</button><button class="nav" data-tab="analysis"><b>◫</b>分析</button><button class="nav" data-tab="growth"><b>↗</b>成長</button></nav>
</div>

<div id="modal" class="modal"><div class="sheet">
<div class="sheethead"><div><div style="font-size:18px;font-weight:900">試合入力</div><div class="tiny">選択中の選手に保存されます</div></div><button id="close" class="close">×</button></div>
<div class="card"><div class="grid2"><label>日付<input id="date" type="date"></label><label>学年<select id="grade"></select></label><label>対戦相手<input id="opp" placeholder="例：○○ジュニア"></label><label>試合種別<select id="type"><option>練習試合</option><option>公式戦</option><option>大会</option></select></label><label>打順<select id="batOrder"><option value="">選択</option><option value="1">1番</option><option value="2">2番</option><option value="3">3番</option><option value="4">4番</option><option value="5">5番</option><option value="6">6番</option><option value="7">7番</option><option value="8">8番</option><option value="9">9番</option></select></label></div></div>
<div class="card"><div class="section">打席</div><div id="atbats"></div><button id="addAB" class="btn outline" style="width:100%">＋ 打席を追加</button></div>
<div class="card"><div class="section">試合結果・走塁</div><div class="grid2">
<div><label>得点</label><div class="stepper"><button data-step="runs" data-d="-1">−</button><span id="runsVal">0</span><button data-step="runs" data-d="1">＋</button></div></div>
<div><label>盗塁</label><div class="stepper"><button data-step="sb" data-d="-1">−</button><span id="sbVal">0</span><button data-step="sb" data-d="1">＋</button></div></div>
<div><label>盗塁死</label><div class="stepper"><button data-step="cs" data-d="-1">−</button><span id="csVal">0</span><button data-step="cs" data-d="1">＋</button></div></div>
<div><label>失策</label><div class="stepper"><button data-step="err" data-d="-1">−</button><span id="errVal">0</span><button data-step="err" data-d="1">＋</button></div></div>
</div></div>
<div class="card"><div class="section">守備位置（複数選択可）</div><div id="positions" class="posgrid"></div><div style="margin-top:12px"><label>一言メモ<textarea id="memo" placeholder="例：追い込まれてからセンター前！"></textarea></label></div></div>
<button id="save" class="btn primary">この試合を保存</button><button id="del" class="btn danger" style="width:100%;margin-top:8px;display:none">この試合を削除</button>
</div></div>

<div id="playerModal" class="modal"><div class="sheet">
<div class="sheethead"><div><div id="playerModalTitle" style="font-size:18px;font-weight:900">選手追加・編集</div><div class="tiny">兄弟それぞれ別に記録できます</div></div><button id="closePlayer" class="close">×</button></div>
<div class="card"><label>表示名<input id="playerName" placeholder="例：長男 / 次男 / 名前"></label><div style="margin-top:10px"><label>現在の学年<select id="playerGrade"></select></label></div></div>
<button id="savePlayer" class="btn primary">保存する</button>
</div></div>

<script>
const KEY='baseballGrowthMultiV2';
const GRADES=['小学1年生','小学2年生','小学3年生','小学4年生','小学5年生','小学6年生','中学1年生','中学2年生','中学3年生'];
let db=JSON.parse(localStorage.getItem(KEY)||'null');
if(!db){
  const old=JSON.parse(localStorage.getItem('baseballGrowthV1')||'null');
  const p1={id:'p1',name:'長男',grade:'小学4年生'};
  db={players:[p1,{id:'p2',name:'次男',grade:'小学2年生'}],currentPlayerId:'p1',games:[]};
  if(old?.games?.length) db.games=old.games.map(g=>({...g,playerId:'p1'}));
}
let editing=null,editingPlayer=null,counters={runs:0,sb:0,cs:0,err:0};
const RESULTS=[['1B','単打'],['2B','二塁打'],['3B','三塁打'],['HR','本塁打'],['BB','四球'],['HBP','死球'],['SO','三振'],['GO','ゴロアウト'],['FO','フライアウト'],['LO','ライナーアウト'],['E','エラー出塁'],['FC','野選'],['KWP','振り逃げ'],['SH','犠打'],['SF','犠飛']];
const DIRS=['左','左中間','中','右中間','右'],CONTACTS=['ゴロ','ライナー','フライ'],POS=['投手','捕手','一塁','二塁','三塁','遊撃','左翼','中堅','右翼'];
function persist(){localStorage.setItem(KEY,JSON.stringify(db));render()}
function currentPlayer(){return db.players.find(p=>p.id===db.currentPlayerId)||db.players[0]}
function gamesForPlayer(){return db.games.filter(g=>g.playerId===currentPlayer().id)}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function rate(x){return Number.isFinite(x)?x.toFixed(3).replace(/^0/,''):'.---'}
function absOf(gs){return gs.flatMap(g=>(g.atbats||[]).map(a=>({...a,game:g})))}
function calc(gs){const A=absOf(gs),n=c=>A.filter(a=>a.result===c).length,H=n('1B')+n('2B')+n('3B')+n('HR'),BB=n('BB'),HBP=n('HBP'),SO=n('SO'),SH=n('SH'),SF=n('SF'),outs=n('GO')+n('FO')+n('LO')+n('E')+n('FC')+n('KWP'),AB=H+SO+outs,PA=AB+BB+HBP+SH+SF,TB=n('1B')+2*n('2B')+3*n('3B')+4*n('HR'),AVG=AB?H/AB:NaN,OBP=(AB+BB+HBP+SF)?(H+BB+HBP)/(AB+BB+HBP+SF):NaN,SLG=AB?TB/AB:NaN,OPS=(Number.isFinite(OBP)&&Number.isFinite(SLG))?OBP+SLG:NaN,RBI=A.reduce((s,a)=>s+(+a.rbi||0),0),R=gs.reduce((s,g)=>s+(+g.runs||0),0),SB=gs.reduce((s,g)=>s+(+g.sb||0),0),CS=gs.reduce((s,g)=>s+(+g.cs||0),0),ERR=gs.reduce((s,g)=>s+(+g.errors||0),0),risp=A.filter(a=>a.risp),rispAB=risp.filter(a=>['1B','2B','3B','HR','SO','GO','FO','LO','E','FC','KWP'].includes(a.result)).length,rispH=risp.filter(a=>['1B','2B','3B','HR'].includes(a.result)).length;return{PA,AB,H,B2:n('2B'),B3:n('3B'),HR:n('HR'),BB,HBP,SO,SH,SF,AVG,OBP,SLG,OPS,RBI,R,SB,CS,ERR,Kpct:PA?SO/PA:NaN,BBpct:PA?BB/PA:NaN,RISPAVG:rispAB?rispH/rispAB:NaN}}
function render(){
 const p=currentPlayer(),games=gamesForPlayer().sort((a,b)=>b.date.localeCompare(a.date)),s=calc(games);
 playerSelect.innerHTML=db.players.map(x=>`<option value="${x.id}" ${x.id===p.id?'selected':''}>${esc(x.name)}</option>`).join('');
 playerSummary.innerHTML=`<div class="playerCard"><div><div class="playerName">${esc(p.name)}</div><div class="meta">${p.grade} / ${games.length}試合記録</div></div><div class="tiny">上の選手名で切替</div></div>`;
 hAVG.textContent=rate(s.AVG);hOBP.textContent=rate(s.OBP);hOPS.textContent=rate(s.OPS);hH.textContent=s.H;hRBI.textContent=s.RBI;hSB.textContent=s.SB;
 recent.innerHTML=games.length?games.slice(0,5).map(g=>{const x=calc([g]);return `<div class="row"><div><b>vs ${esc(g.opponent||'未入力')}</b><div class="meta">${g.date}・${g.batOrder?g.batOrder+'番・':''}${g.grade}</div></div><div><b>${rate(x.AVG)}</b><div class="meta">${x.H}/${x.AB}</div></div></div>`}).join(''):`<div class="empty">まだ試合データがありません。</div>`;
 gameList.innerHTML=games.length?games.map(g=>{const x=calc([g]);return `<div class="row" onclick="editGame('${g.id}')"><div><b>${g.date} vs ${esc(g.opponent||'未入力')}</b><div class="meta">${g.type}・${g.batOrder?g.batOrder+'番・':''}${x.H}安打 ${x.RBI}打点</div></div><div class="tiny">編集</div></div>`}).join(''):`<div class="empty">試合を記録しよう⚾️</div>`;
 const items=[['打率',rate(s.AVG)],['出塁率',rate(s.OBP)],['長打率',rate(s.SLG)],['OPS',rate(s.OPS)],['打席',s.PA],['打数',s.AB],['安打',s.H],['二塁打',s.B2],['三塁打',s.B3],['本塁打',s.HR],['打点',s.RBI],['得点',s.R],['四球',s.BB],['死球',s.HBP],['三振',s.SO],['盗塁',s.SB],['盗塁死',s.CS],['得点圏打率',rate(s.RISPAVG)]];
 statsGrid.innerHTML=items.map(([k,v])=>`<div class="stat"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('');
 renderBars(dirAnalysis,DIRS.map(d=>[d,absOf(games).filter(a=>a.direction===d).length]));
 renderBars(contactAnalysis,CONTACTS.map(d=>[d,absOf(games).filter(a=>a.contact===d).length]));
 discAnalysis.innerHTML=`<div class="analysis-row"><div>三振率</div><div class="bar"><div style="width:${Number.isFinite(s.Kpct)?s.Kpct*100:0}%"></div></div><div>${Number.isFinite(s.Kpct)?Math.round(s.Kpct*100):0}%</div></div><div class="analysis-row"><div>四球率</div><div class="bar"><div style="width:${Number.isFinite(s.BBpct)?s.BBpct*100:0}%"></div></div><div>${Number.isFinite(s.BBpct)?Math.round(s.BBpct*100):0}%</div></div><div class="analysis-row"><div>得点圏</div><div></div><div>${rate(s.RISPAVG)}</div></div>`;
 const orders=[1,2,3,4,5,6,7,8,9].map(o=>[o,games.filter(g=>+g.batOrder===o)]).filter(x=>x[1].length);
 orderAnalysis.innerHTML=orders.length?orders.map(([o,gs])=>{const x=calc(gs);return `<div class="row"><div><b>${o}番</b><div class="meta">${gs.length}試合・${x.PA}打席</div></div><div style="text-align:right"><b>打率 ${rate(x.AVG)}</b><div class="meta">出塁率 ${rate(x.OBP)} / OPS ${rate(x.OPS)}</div></div></div>`}).join(''):`<div class="empty">試合入力で打順を選ぶと表示されます。</div>`;
 const grades=[...new Set(games.map(g=>g.grade))];
 gradeGrowth.innerHTML=grades.length?grades.map(gr=>{const gs=games.filter(g=>g.grade===gr),x=calc(gs);return `<div class="growcard"><b>${gr}</b><div class="meta">${gs.length}試合</div><div style="margin-top:7px">打率 <b>${rate(x.AVG)}</b></div><div>OPS <b>${rate(x.OPS)}</b></div><div>三振率 <b>${Number.isFinite(x.Kpct)?Math.round(x.Kpct*100):0}%</b></div></div>`}).join(''):`<div class="empty">学年ごとの成長がここに残ります。</div>`;
 memoList.innerHTML=games.filter(g=>g.memo).length?games.filter(g=>g.memo).map(g=>`<div class="row"><div><b>${g.date} vs ${esc(g.opponent||'')}</b><div class="meta">${esc(g.memo)}</div></div></div>`).join(''):`<div class="empty">メモはまだありません。</div>`;
 playerList.innerHTML=db.players.map(x=>`<div class="row"><div><b>${esc(x.name)}</b><div class="meta">${x.grade} / ${db.games.filter(g=>g.playerId===x.id).length}試合</div></div><button class="btn outline" style="padding:7px 10px" onclick="editPlayer('${x.id}')">編集</button></div>`).join('');
}
function renderBars(el,pairs){const t=pairs.reduce((s,x)=>s+x[1],0);el.innerHTML=t?pairs.map(([k,v])=>{const p=Math.round(v/t*100);return `<div class="analysis-row"><div>${k}</div><div class="bar"><div style="width:${p}%"></div></div><div>${p}%</div></div>`}).join(''):`<div class="empty">打球データを入力すると表示されます。</div>`}
playerSelect.onchange=()=>{db.currentPlayerId=playerSelect.value;persist()}
document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id===b.dataset.tab));document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n===b));window.scrollTo(0,0)});
function setCounter(k,v){counters[k]=Math.max(0,v);document.getElementById(k==='err'?'errVal':k+'Val').textContent=counters[k]}
document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>setCounter(b.dataset.step,counters[b.dataset.step]+(+b.dataset.d)));
grade.innerHTML=playerGrade.innerHTML=GRADES.map(g=>`<option>${g}</option>`).join('');
positions.innerHTML=POS.map(p=>`<button type="button" class="posbtn" data-pos="${p}">${p}</button>`).join('');positions.querySelectorAll('.posbtn').forEach(b=>b.onclick=()=>b.classList.toggle('active'));
function addAtbat(d={}){const w=document.createElement('div');w.className='atbat';w.dataset.id=d.id||crypto.randomUUID();w.innerHTML=`<div class="athead"><b>第${atbats.children.length+1}打席</b><button class="btn outline rm" style="padding:6px 9px">削除</button></div><div class="tiny" style="margin-top:8px">① 結果</div><div class="result-grid">${RESULTS.map(([c,n])=>`<button type="button" class="choice ${d.result===c?'active':''}" data-r="${c}">${n}</button>`).join('')}</div><div class="tiny" style="margin-top:12px">② 打球方向（分かる時だけ）</div><div class="chips dirs">${DIRS.map(x=>`<button type="button" class="chip ${d.direction===x?'active':''}" data-v="${x}">${x}</button>`).join('')}</div><div class="tiny" style="margin-top:12px">③ 打球タイプ（分かる時だけ）</div><div class="chips contacts">${CONTACTS.map(x=>`<button type="button" class="chip ${d.contact===x?'active':''}" data-v="${x}">${x}</button>`).join('')}</div><div class="grid2" style="margin-top:12px"><label>打点<input class="rbi" type="number" min="0" max="4" value="${d.rbi||0}"></label><label style="display:flex;align-items:center;gap:8px;margin-top:22px"><input class="risp" type="checkbox" style="width:auto;margin:0" ${d.risp?'checked':''}>得点圏だった</label></div>`;w.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{w.querySelectorAll('[data-r]').forEach(x=>x.classList.remove('active'));b.classList.add('active')});['.dirs .chip','.contacts .chip'].forEach(sel=>w.querySelectorAll(sel).forEach(b=>b.onclick=()=>{const was=b.classList.contains('active');w.querySelectorAll(sel).forEach(x=>x.classList.remove('active'));if(!was)b.classList.add('active')}));w.querySelector('.rm').onclick=()=>{w.remove();[...atbats.children].forEach((x,i)=>x.querySelector('.athead b').textContent=`第${i+1}打席`)};atbats.appendChild(w)}
function openModal(g=null){editing=g?.id||null;const p=currentPlayer();date.value=g?.date||new Date().toISOString().slice(0,10);grade.value=g?.grade||p.grade;opp.value=g?.opponent||'';type.value=g?.type||'練習試合';batOrder.value=g?.batOrder||'';atbats.innerHTML='';(g?.atbats?.length?g.atbats:[{}]).forEach(addAtbat);setCounter('runs',g?.runs||0);setCounter('sb',g?.sb||0);setCounter('cs',g?.cs||0);setCounter('err',g?.errors||0);positions.querySelectorAll('.posbtn').forEach(b=>b.classList.toggle('active',(g?.positions||[]).includes(b.dataset.pos)));memo.value=g?.memo||'';del.style.display=editing?'block':'none';modal.classList.add('open')}
newGame.onclick=()=>openModal();newGame2.onclick=()=>openModal();close.onclick=()=>modal.classList.remove('open');addAB.onclick=()=>addAtbat();window.editGame=id=>openModal(db.games.find(g=>g.id===id));
save.onclick=()=>{const A=[...atbats.children].map(w=>({id:w.dataset.id,result:w.querySelector('[data-r].active')?.dataset.r||'',direction:w.querySelector('.dirs .active')?.dataset.v||'',contact:w.querySelector('.contacts .active')?.dataset.v||'',rbi:+w.querySelector('.rbi').value||0,risp:w.querySelector('.risp').checked})).filter(a=>a.result);if(!A.length){alert('少なくとも1打席の結果を選んでください');return}const g={id:editing||crypto.randomUUID(),playerId:currentPlayer().id,date:date.value,grade:grade.value,opponent:opp.value.trim(),type:type.value,batOrder:batOrder.value,atbats:A,runs:counters.runs,sb:counters.sb,cs:counters.cs,errors:counters.err,positions:[...positions.querySelectorAll('.active')].map(b=>b.dataset.pos),memo:memo.value.trim()};if(editing){const i=db.games.findIndex(x=>x.id===editing);db.games[i]=g}else db.games.push(g);persist();modal.classList.remove('open')}
del.onclick=()=>{if(editing&&confirm('この試合を削除しますか？')){db.games=db.games.filter(g=>g.id!==editing);persist();modal.classList.remove('open')}};
addPlayerBtn.onclick=()=>{editingPlayer=null;playerModalTitle.textContent='選手を追加';playerName.value='';playerGrade.value='小学2年生';playerModal.classList.add('open')};
closePlayer.onclick=()=>playerModal.classList.remove('open');
window.editPlayer=id=>{const x=db.players.find(p=>p.id===id);if(!x)return;editingPlayer=id;playerModalTitle.textContent='選手を編集';playerName.value=x.name;playerGrade.value=x.grade;playerModal.classList.add('open')};
savePlayer.onclick=()=>{const name=playerName.value.trim();if(!name){alert('表示名を入力してください');return}
 if(editingPlayer){const x=db.players.find(p=>p.id===editingPlayer);x.name=name;x.grade=playerGrade.value;}
 else{const id=crypto.randomUUID();db.players.push({id,name,grade:playerGrade.value});db.currentPlayerId=id;}
 persist();playerModal.classList.remove('open')};
render();
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(reg=>{
    reg.update().catch(()=>{});
  }).catch(()=>{});
}
</script>
</body>
</html>
